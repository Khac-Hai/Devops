name: Session 08 Exercise 03 - Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'session_08/exercise_03/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Payment Service Image to GHCR
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: session_08/exercise_03

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/payment-service"
          docker build -t ${IMAGE_NAME}:1.0.0 .
          docker tag ${IMAGE_NAME}:1.0.0 ${IMAGE_NAME}:latest

      - name: Push Docker Image to GHCR
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/payment-service"
          docker push ${IMAGE_NAME}:1.0.0
          docker push ${IMAGE_NAME}:latest
