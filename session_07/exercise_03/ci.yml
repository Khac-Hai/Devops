name: Payment Service CI

on:
  push:
    branches:
      - main

jobs:
  # Giai đoạn 1: Chạy toàn bộ Unit Test
  test_job:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

  # Giai đoạn 2: Chỉ chạy khi Giai đoạn 1 (test_job) thành công
  build_job:
    name: Build & Package JAR
    needs: test_job
    runs-on: ubuntu-latest
    steps:
      # Do tính chất Job Isolation: Cần checkout lại mã nguồn
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Do tính chất Job Isolation: Cần setup lại môi trường Java
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # Cấp quyền thực thi và build JAR
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR Package
        run: ./gradlew bootJar -x test

      # Lưu lại file JAR dưới dạng Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-artifact
          path: build/libs/*.jar
          retention-days: 3
