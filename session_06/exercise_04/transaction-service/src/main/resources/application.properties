spring.application.name=transaction-service
server.port=8081

account.service.url=${ACCOUNT_SERVICE_URL:http://account-service:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://core-db:5432/banking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-TransactionService
logging.level.com.zaxxer.hikari=INFO
logging.level.com.example.transaction=INFO
